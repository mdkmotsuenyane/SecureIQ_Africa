name: .NET Desktop

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.sln'
      - '**.aspx'
      - '**.aspx.cs'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allows manual triggering

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug, Release]
        platform: [Any CPU]
        
    runs-on: windows-latest  # For Windows Forms / WPF / WebForms
    
    env:
      SOLUTION_NAME: SecureIQ_Africa.sln
      PROJECT_NAME: SecureIQ_Africa.csproj

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Get all history for better versioning

    # Install required .NET Framework components
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1
      
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v1.1
      
    - name: Setup VSTest
      uses: darenm/Setup-VSTest@v1
      
    # Cache NuGet packages for faster builds
    - name: Cache NuGet packages
      uses: actions/cache@v3
      with:
        path: packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.config') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
          ${{ runner.os }}-nuget-

    # Restore NuGet packages
    - name: Restore NuGet packages
      run: nuget restore ${{ env.SOLUTION_NAME }}
      
    # Build the solution
    - name: Build solution
      run: msbuild ${{ env.SOLUTION_NAME }} /p:Configuration=${{ matrix.configuration }} /p:Platform="${{ matrix.platform }}" /verbosity:minimal /p:OutputPath=bin/${{ matrix.configuration }}
      
    # Run unit tests (if you have any)
    - name: Run unit tests
      run: |
        # Find all test projects
        $testProjects = Get-ChildItem -Recurse -Filter "*Test*.csproj" -ErrorAction SilentlyContinue
        if ($testProjects) {
          foreach ($test in $testProjects) {
            vstest.console.exe $test.FullName /Logger:trx
          }
        } else {
          Write-Host "No test projects found - skipping tests"
        }
      continue-on-error: true
      
    # Run code analysis (optional)
    - name: Run code analysis
      run: |
        Write-Host "Running code analysis..."
        # Add your preferred code analysis tool here
        
    # Upload build artifacts
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: SecureIQ_Africa-${{ matrix.configuration }}
        path: |
          **/bin/${{ matrix.configuration }}/
          **/obj/${{ matrix.configuration }}/
        retention-days: 7
        
    # Prepare for deployment
    - name: Prepare deployment package
      if: matrix.configuration == 'Release' && github.ref == 'refs/heads/main'
      run: |
        # Create deployment folder
        New-Item -ItemType Directory -Force -Path deploy
        
        # Copy web files
        Copy-Item -Path "*.aspx" -Destination "deploy/" -Recurse -ErrorAction SilentlyContinue
        Copy-Item -Path "*.aspx.cs" -Destination "deploy/" -Recurse -ErrorAction SilentlyContinue
        Copy-Item -Path "Web.config" -Destination "deploy/" -ErrorAction SilentlyContinue
        Copy-Item -Path "Global.asax" -Destination "deploy/" -ErrorAction SilentlyContinue
        
        # Copy compiled binaries
        Copy-Item -Path "**/bin/${{ matrix.configuration }}/*" -Destination "deploy/bin/" -Recurse
        
        # Copy styles and scripts
        Copy-Item -Path "Styles/" -Destination "deploy/Styles/" -Recurse -ErrorAction SilentlyContinue
        Copy-Item -Path "Scripts/" -Destination "deploy/Scripts/" -Recurse -ErrorAction SilentlyContinue
        
        # Create ZIP archive
        Compress-Archive -Path "deploy/*" -DestinationPath "SecureIQ_Africa_${{ github.run_number }}.zip"
        
    # Upload deployment package
    - name: Upload deployment package
      if: matrix.configuration == 'Release' && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v3
      with:
        name: Deployment-Package
        path: SecureIQ_Africa_${{ github.run_number }}.zip
        retention-days: 30

  # Security scanning job
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run CodeQL Analysis
      uses: github/codeql-action/init@v2
      with:
        languages: csharp
        queries: security-and-quality
        
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v2
      
    - name: Run Secret Scanner
      run: |
        # Check for hardcoded secrets
        Write-Host "Scanning for secrets..."
        # Add truffleHog or similar tool here

  # Create release on tag
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, security-scan]
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download artifacts
      uses: actions/download-artifact@v3
      with:
        name: Deployment-Package
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          SecureIQ_Africa_*.zip
        body: |
          ## SecureIQ Africa Cybersecurity Chatbot Release
          
          ### Features:
          - Interactive cybersecurity education
          - Real-time threat awareness
          - Security tips database
          
          ### Installation:
          1. Extract the ZIP file
          2. Deploy to IIS
          3. Configure Web.config
          4. Access via browser
          
          ### Requirements:
          - Windows Server 2012+
          - IIS 8+
          - .NET Framework 4.7.2+
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
